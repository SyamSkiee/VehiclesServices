<!DOCTYPE html>
<html lang="en">

<head>
    <!-- META SETTINGS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Maintenance Tracker</title>

    <!-- STYLESHEETS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="carpage.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="index-body">

    <!-- MAIN CONTAINER -->
    <div class="container-fluid mt-5">
        <div class="row">

            <!-- SIDEBAR -->
            <div class="col-md-2 sidebar">
                <ul>
                    <li>
                        <a href="dashboard.html" class="text-decoration-none text-reset d-block">Dashboard</a>
                    </li>
                    <li class="active">
                        <a href="CarList.html" class="text-decoration-none text-reset d-block">Vehicles</a>
                    </li>
                    <li>
                        <a href="History.html" class="text-decoration-none text-reset d-block">History</a>
                    </li>
                    <li>
                        <a href="booking.html" class="text-decoration-none text-reset d-block">Bookings</a>
                    </li>
                    <li>
                        <a href="index.html" class="text-decoration-none text-reset d-block">LogOut</a>
                    </li>
                </ul>
            </div>
            <!-- SIDEBAR -->

            <!-- MAIN CONTENT -->
            <div class="col-md-10">

                <!-- PAGE TITLE -->
                <h1 class="title">CAR MAINTENANCE TRACKER</h1>

                <!-- CARD SECTION -->
                <div class="card mt-4 p-4">

                    <!-- HEADER SECTION -->
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">

                        <div>
                            <h3 class="mb-1">Registered Vehicles</h3>
                            <p class="text-muted small mb-0">
                                Browse and manage registered fleet vehicles and their current status.
                            </p>
                        </div>

                        <button class="new-btn add-vehicle-btn" data-bs-toggle="modal"
                            data-bs-target="#addVehicleModal">
                            + Add Vehicle
                        </button>

                    </div>

                    <!-- TAB SECTION -->
                    <div class="view-tabs-container mb-4">
                        <button class="view-tab-btn active">▩ Gallery</button>
                    </div>

                    <!-- CAROUSEL SECTION -->
                    <div class="vehicle-card-wrapper">

                        <div id="vehicleCarousel" class="carousel slide" data-bs-ride="carousel">

                            <!-- INDICATORS -->
                            <div class="custom-carousel-indicators">
                                <!-- Dynamically populated by JS -->
                            </div>

                            <!-- CAROUSEL ITEMS -->
                            <div class="carousel-inner">
                                <!-- Dynamically populated by JS -->
                            </div>

                            <!-- CONTROLS -->
                            <button class="custom-prev-btn" type="button" data-bs-target="#vehicleCarousel"
                                data-bs-slide="prev">
                                <i class="fw-bold">&lsaquo;</i>
                            </button>

                            <button class="custom-next-btn" type="button" data-bs-target="#vehicleCarousel"
                                data-bs-slide="next">
                                <i class="fw-bold">&rsaquo;</i>
                            </button>

                        </div>

                    </div>

                </div>

            </div>
            <!-- MAIN CONTENT -->

        </div>
    </div>

    <!-- ADD VEHICLE MODAL -->
    <div class="modal fade" id="addVehicleModal" tabindex="-1" aria-labelledby="addVehicleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="addVehicleModalLabel">Add New Vehicle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addVehicleForm">
                    <div class="modal-body p-4 text-dark">
                        <div class="mb-3">
                            <label for="carBrand" class="form-label fw-semibold">Car Brand</label>
                            <input type="text" class="form-control" id="carBrand"
                                placeholder="e.g. Nissan GTR, Toyota, Honda" required>
                        </div>
                        <div class="mb-3">
                            <label for="carModel" class="form-label fw-semibold">Car Model</label>
                            <input type="text" class="form-control" id="carModel"
                                placeholder="e.g. Nissan GTR, Corolla GR" required>
                        </div>
                        <div class="mb-3">
                            <label for="carPlate" class="form-label fw-semibold">Plate Number</label>
                            <input type="text" class="form-control" id="carPlate" placeholder="e.g. ABC 1234" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Vehicle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- VEHICLE MANAGER -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const vehicles = [
                { brand: "Nissan", model: "GTR", plate: "BCA 7839", image: "car3.png" },
                { brand: "Toyota", model: "COROLLA GR", plate: "ABC 2841", image: "car2.png" },
                { brand: "Dodge", model: "CHALLENGER SRT", plate: "BAC 1092", image: "car1.png" }
            ];

            const carouselInner = document.querySelector("#vehicleCarousel .carousel-inner");
            const carouselIndicators = document.querySelector("#vehicleCarousel .custom-carousel-indicators");

            function renderCarousel() {
                carouselInner.innerHTML = "";
                carouselIndicators.innerHTML = "";

                vehicles.forEach((car, index) => {
                    // Render Indicator
                    const indicatorBtn = document.createElement("button");
                    indicatorBtn.type = "button";
                    indicatorBtn.setAttribute("data-bs-target", "#vehicleCarousel");
                    indicatorBtn.setAttribute("data-bs-slide-to", index);
                    indicatorBtn.setAttribute("aria-label", `Slide ${index + 1}`);
                    if (index === 0) {
                        indicatorBtn.classList.add("active");
                        indicatorBtn.setAttribute("aria-current", "true");
                    }
                    carouselIndicators.appendChild(indicatorBtn);

                    // Render Carousel Item
                    const carouselItem = document.createElement("div");
                    carouselItem.className = `carousel-item ${index === 0 ? "active" : ""}`;
                    carouselItem.innerHTML = `
                        <div class="carousel-image-container">
                            <img src="${car.image}" class="carousel-image" alt="${car.brand}">
                            <div class="car-info">
                                <h2 class="car-brand">${car.brand}</h2>
                                <span class="car-model">${car.model}</span>
                                <span class="car-plate d-block mt-2 badge bg-dark text-white px-3 py-2 fw-semibold">${car.plate || "N/A"}</span>
                            </div>
                        </div>
                    `;
                    carouselInner.appendChild(carouselItem);
                });

                //  Bootstrap 
                const carouselEl = document.getElementById('vehicleCarousel');
                const existingInstance = bootstrap.Carousel.getInstance(carouselEl);
                if (existingInstance) {
                    existingInstance.dispose();
                }
                new bootstrap.Carousel(carouselEl, {
                    ride: 'carousel'
                });
            }

            // Form submission
            const form = document.getElementById("addVehicleForm");
            form.addEventListener("submit", function (e) {
                e.preventDefault();

                const brand = document.getElementById("carBrand").value.trim();
                const model = document.getElementById("carModel").value.trim().toUpperCase();
                const plate = document.getElementById("carPlate").value.trim().toUpperCase();

                //  image style
                let image = "car3.png";
                const brandLower = brand.toLowerCase();
                if (brandLower.includes("toyota")) {
                    image = "car2.png";
                } else if (brandLower.includes("dodge") || brandLower.includes("challenger")) {
                    image = "car1.png";
                } else if (brandLower.includes("nissan") || brandLower.includes("gtr")) {
                    image = "car3.png";
                } else {
                    const cycleImages = ["car3.png", "car2.png", "car1.png"];
                    image = cycleImages[vehicles.length % 3];
                }

                const newCar = { brand, model, plate, image };
                vehicles.push(newCar);

                // Re-render
                renderCarousel();

                //added vehicle
                const carouselEl = document.getElementById('vehicleCarousel');
                const carouselInstance = bootstrap.Carousel.getInstance(carouselEl);
                if (carouselInstance) {
                    carouselInstance.to(vehicles.length - 1);
                }

                // Reset form
                form.reset();

                const modalEl = document.getElementById('addVehicleModal');
                const closeBtn = modalEl.querySelector('[data-bs-dismiss="modal"]');
                if (closeBtn) {
                    closeBtn.click();
                }
            });
            renderCarousel();
        });
    </script>

    <!-- FOOTER -->
    <footer class="site-footer mt-5">
        <div class="container-fluid">

            <hr class="footer-line">

            <div class="text-center footer-bottom">
                © 2026 Car Maintenance Tracker. All rights reserved.
            </div>

        </div>
    </footer>

</body>

</html>
