<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META SETTINGS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Service Booking</title>

    <!-- STYLESHEETS -->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="booking.css">

</head>

<body>

    <!-- MAIN CONTAINER -->
    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <div class="col-md-2 sidebar">

                <!-- SIDEBAR MENU -->
                <ul>
                    <li>
                        <a href="dashboard.html" class="text-decoration-none text-white d-block">Dashboard</a>
                    </li>

                    <li>
                        <a href="CarList.html" class="text-decoration-none text-white d-block">Vehicles</a>
                    </li>

                    <li>
                        <a href="History.html" class="text-decoration-none text-white d-block">History</a>
                    </li>

                    <li class="active">
                        <a href="booking.html" class="text-decoration-none text-white d-block">Bookings</a>
                    </li>

                    <li>
                        <a href="index.html" class="text-decoration-none text-white d-block">LogOut</a>
                    </li>
                </ul>

            </div>

            <!-- MAIN CONTENT -->
            <div class="col-md-10 d-flex justify-content-center align-items-center p-4">

                <!-- BOOKING CONTAINER -->
                <div class="booking-container w-100">

                    <!-- PAGE TITLE -->
                    <h2 class="text-center mb-4">
                        Book Car Service
                    </h2>

                    <!-- BOOKING FORM -->
                    <form id="bookingForm">

                        <!-- CUSTOMER INFORMATION -->
                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text" name="full_name" class="form-control" required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input type="text" name="phone_number" class="form-control" required>

                            </div>

                        </div>

                        <!-- VEHICLE INFORMATION -->
                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Car Model
                                </label>

                                <input type="text" name="car_model" class="form-control" required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Plate Number
                                </label>

                                <input type="text" name="plate_number" class="form-control" required>

                            </div>

                        </div>

                        <!-- SERVICE SELECTION -->
                        <div class="mb-3">

                            <label class="form-label">
                                Service Type
                            </label>

                            <select name="service_type" class="form-select" required>

                                <option value="">
                                    Select Service
                                </option>

                                <option>Oil Change</option>
                                <option>Engine Check</option>
                                <option>Tire Replacement</option>
                                <option>Full Service</option>
                                <option>Brake Inspection</option>

                            </select>

                        </div>

                        <!-- BOOKING DATE AND TIME -->
                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Preferred Date
                                </label>

                                <input type="date" name="booking_date" class="form-control" required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Preferred Time
                                </label>

                                <input type="time" name="booking_time" class="form-control" required>

                            </div>

                        </div>

                        <!-- ADDITIONAL NOTES -->
                        <div class="mb-3">

                            <label class="form-label">
                                Additional Notes
                            </label>

                            <textarea name="additional_notes" class="form-control" rows="4"></textarea>

                        </div>

                        <!-- SUBMIT BUTTON -->
                        <button type="submit" class="btn btn-primary w-100">

                            Book Now

                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('bookingForm');
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    alert('Booking submitted successfully!');
                    window.location.href = 'History.html';
                });
            }
        });
    </script>

    <!-- FOOTER -->
    <footer class="site-footer mt-5">

        <div class="container-fluid">

            <hr class="footer-line">

            <!-- FOOTER TEXT -->
            <div class="text-center footer-bottom">

                © 2026 Car Maintenance Tracker. All rights reserved.

            </div>

        </div>

    </footer>

</body>

</html>
